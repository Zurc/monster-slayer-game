<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Slayer</title>
    <link href="https://fonts.googleapis.com/css2?family=Monofett&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #0d0f1b;
            color: #00f260;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-shadow: 0 0 5px #00f260, 0 0 10px #00f260;
        }

        .game-container {
            background-color: #1a1a2e;
            padding: 40px;
            border-radius: 5px;
            box-shadow: 0 0 20px #0575e6, inset 0 0 10px #0575e6;
            border: 2px solid #0575e6;
            width: 100%;
            max-width: 800px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        h1 {
            color: #00f260;
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #00f260, 0 0 20px #00f260;
        }
        
        .participants {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .participant {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%;
            min-width: 280px;
            color: #ffffff;
            font-family: 'Monofett', cursive;
            font-size: 1.2rem;
            text-shadow: none;
        }

        .participant-name {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 5px #fff;
        }

        .health-bar-container {
            width: 100%;
            background-color: #4a4a68;
            border-radius: 5px;
            border: 1px solid #0575e6;
            box-shadow: 0 0 10px rgba(0, 117, 230, 0.5), inset 0 0 5px rgba(0, 117, 230, 0.5);
            overflow: hidden;
        }

        .health-bar {
            height: 30px;
            background-image: linear-gradient(90deg, #00f260, #0575e6);
            transition: width 0.5s ease-in-out;
            text-align: center;
            line-height: 30px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 5px #fff;
            font-family: 'Press Start 2P', cursive;
        }

        .health-bar.monster {
            background-image: linear-gradient(90deg, #ff416c, #ff4b2b);
        }
        
        .health-bar.low {
            background-image: linear-gradient(90deg, #ff0000, #ff8c00);
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-button {
            padding: 15px 25px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 10px #00f260;
            background-color: #1a1a2e;
            transition: box-shadow 0.2s, transform 0.2s;
            flex: 1;
            min-width: 180px;
            font-family: 'Press Start 2P', cursive;
        }

        .action-button:hover:not(:disabled) {
            box-shadow: 0 0 15px #00f260, 0 0 25px #00f260, 0 0 30px #00f260;
            transform: translateY(-2px);
        }
        
        .action-button:disabled {
            border-color: #666;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
            background-color: #333;
        }

        #heal-button {
            border-color: #00f260;
        }

        #strong-attack-button {
            border-color: #ffc629;
        }

        #log-container {
            background-color: #0d0f1b;
            padding: 15px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            border: 2px solid #0575e6;
            box-shadow: inset 0 0 10px #0575e6;
            font-family: 'Monofett', cursive;
            color: #fff;
            text-shadow: none;
        }
        
        .log-message {
            margin-bottom: 8px;
            font-size: 1.1rem;
            line-height: 1.2;
        }

        .log-message.player-turn { color: #00f260; }
        .log-message.monster-turn { color: #ff416c; }
        .log-message.system-message { color: #fff; font-weight: bold; }
        .log-message.game-over { color: #ff0000; font-weight: bold; font-size: 1.4rem;}

        #game-over-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 10;
        }
        
        #game-over-message {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            margin-bottom: 20px;
        }
        
        #new-game-button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            border: 2px solid #00f260;
            border-radius: 5px;
            cursor: pointer;
            background-color: #1a1a2e;
            box-shadow: 0 0 10px #00f260;
            transition: box-shadow 0.2s, transform 0.2s;
            font-family: 'Press Start 2P', cursive;
        }
        
        #new-game-button:hover {
            box-shadow: 0 0 15px #00f260, 0 0 25px #00f260, 0 0 30px #00f260;
            transform: translateY(-2px);
        }
        
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 20;
            gap: 20px;
        }
        
        #start-screen h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00f260, 0 0 20px #00f260;
        }
        
        #username-input {
            padding: 10px;
            font-size: 1.2rem;
            background-color: #333;
            color: #00f260;
            border: 2px solid #00f260;
            box-shadow: 0 0 5px #00f260;
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            width: 80%;
            max-width: 400px;
        }
        
        .difficulty-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }

        .difficulty-button {
            padding: 15px 25px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 10px #00f260;
            background-color: #1a1a2e;
            transition: box-shadow 0.2s, transform 0.2s;
            font-family: 'Press Start 2P', cursive;
        }
        
        .difficulty-button:hover {
            box-shadow: 0 0 15px #00f260, 0 0 25px #00f260, 0 0 30px #00f260;
            transform: translateY(-2px);
        }
        
        .difficulty-button.easy { border-color: #00ff7f; box-shadow: 0 0 10px #00ff7f;}
        .difficulty-button.normal { border-color: #ffc629; box-shadow: 0 0 10px #ffc629;}
        .difficulty-button.hard { border-color: #ff416c; box-shadow: 0 0 10px #ff416c;}
        
        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
            }
            .participant {
                width: 100%;
            }
            h1 {
                font-size: 2rem;
            }
            #game-over-message {
                font-size: 2rem;
            }
            #start-screen h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Monster Slayer</h1>

    <div class="participants">
        <div class="participant">
            <div id="player-name" class="participant-name"></div>
            <div class="health-bar-container">
                <div id="player-health-bar" class="health-bar" style="width: 100%;">100 HP</div>
            </div>
        </div>
        <div class="participant">
            <div class="participant-name">Monster</div>
            <div class="health-bar-container">
                <div id="monster-health-bar" class="health-bar monster" style="width: 100%;">100 HP</div>
            </div>
        </div>
    </div>

    <div class="actions">
        <button id="regular-attack-button" class="action-button">Regular Attack</button>
        <button id="strong-attack-button" class="action-button">Strong Attack</button>
        <button id="heal-button" class="action-button">Heal</button>
    </div>

    <div id="log-container">
        <!-- Game messages will appear here -->
    </div>

    <div id="game-over-screen">
        <div id="game-over-message"></div>
        <button id="new-game-button">Start New Game</button>
    </div>
</div>

<div id="start-screen">
    <h2>Enter Username</h2>
    <input type="text" id="username-input" placeholder="Your Name">
    <h2>Choose Difficulty</h2>
    <div class="difficulty-buttons">
        <button id="easy-difficulty" class="difficulty-button easy">Easy</button>
        <button id="normal-difficulty" class="difficulty-button normal">Normal</button>
        <button id="hard-difficulty" class="difficulty-button hard">Hard</button>
    </div>
</div>

<script>
    // Constants for game settings and difficulty levels
    const MAX_HEALTH = 100;
    const DIFFICULTY_SETTINGS = {
        easy: {
            playerAttackMin: 12, playerAttackMax: 20,
            playerStrongAttackMin: 25, playerStrongAttackMax: 35,
            playerHealMin: 15, playerHealMax: 25,
            monsterAttackMin: 5, monsterAttackMax: 10,
        },
        normal: {
            playerAttackMin: 8, playerAttackMax: 15,
            playerStrongAttackMin: 18, playerStrongAttackMax: 25,
            playerHealMin: 10, playerHealMax: 20,
            monsterAttackMin: 10, monsterAttackMax: 17,
        },
        hard: {
            playerAttackMin: 5, playerAttackMax: 10,
            playerStrongAttackMin: 15, playerStrongAttackMax: 20,
            playerHealMin: 5, playerHealMax: 15,
            monsterAttackMin: 15, monsterAttackMax: 25,
        }
    };
    
    // Cooldown constants
    const STRONG_ATTACK_COOLDOWN = 3;
    const HEAL_COOLDOWN = 5;

    // Game state variables
    let playerHealth = MAX_HEALTH;
    let monsterHealth = MAX_HEALTH;
    let turnCount = 0;
    let strongAttackCooldown = 0;
    let healCooldown = 0;
    let difficulty = 'normal';
    let username = '';

    // DOM elements
    const playerName = document.getElementById('player-name');
    const playerHealthBar = document.getElementById('player-health-bar');
    const monsterHealthBar = document.getElementById('monster-health-bar');
    const regularAttackBtn = document.getElementById('regular-attack-button');
    const strongAttackBtn = document.getElementById('strong-attack-button');
    const healBtn = document.getElementById('heal-button');
    const logContainer = document.getElementById('log-container');
    const gameOverScreen = document.getElementById('game-over-screen');
    const gameOverMessage = document.getElementById('game-over-message');
    const newGameBtn = document.getElementById('new-game-button');
    const startScreen = document.getElementById('start-screen');
    const usernameInput = document.getElementById('username-input');
    const easyBtn = document.getElementById('easy-difficulty');
    const normalBtn = document.getElementById('normal-difficulty');
    const hardBtn = document.getElementById('hard-difficulty');

    // --- Helper Functions ---
    
    // Function to get a random integer within a range
    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Function to add a message to the game log
    function addLogMessage(message, type) {
        const p = document.createElement('p');
        p.className = `log-message ${type}`;
        p.textContent = message;
        logContainer.appendChild(p);
        logContainer.scrollTop = logContainer.scrollHeight; // Auto-scroll to the bottom
    }

    // Function to update health bars and display new health
    function updateHealthBars() {
        // Player Health Bar
        const playerHealthPercentage = Math.max(0, playerHealth); // Ensure health doesn't go below 0
        playerHealthBar.style.width = `${playerHealthPercentage}%`;
        playerHealthBar.textContent = `${playerHealth} HP`;
        if (playerHealth <= 25) {
            playerHealthBar.classList.add('low');
        } else {
            playerHealthBar.classList.remove('low');
        }

        // Monster Health Bar
        const monsterHealthPercentage = Math.max(0, monsterHealth);
        monsterHealthBar.style.width = `${monsterHealthPercentage}%`;
        monsterHealthBar.textContent = `${monsterHealth} HP`;
        if (monsterHealth <= 25) {
            monsterHealthBar.classList.add('low');
        } else {
            monsterHealthBar.classList.remove('low');
        }
    }

    // Function to check for game over condition
    function checkForGameOver() {
        if (playerHealth <= 0) {
            endGame(`${username} was defeated! The monster wins!`);
            return true;
        }
        if (monsterHealth <= 0) {
            endGame(`${username} has slain the monster! You win!`);
            return true;
        }
        return false;
    }

    // Function to handle the end of the game
    function endGame(message) {
        gameOverMessage.textContent = message;
        gameOverScreen.style.display = 'flex';
        // Disable all buttons to prevent further actions
        regularAttackBtn.disabled = true;
        strongAttackBtn.disabled = true;
        healBtn.disabled = true;
        addLogMessage(message, 'game-over');
    }

    // Function to reset the game to its initial state (before start screen)
    function showStartScreen() {
        startScreen.style.display = 'flex';
        gameOverScreen.style.display = 'none';
        logContainer.innerHTML = '';
    }

    // Function to start the game after selecting difficulty
    function startGame() {
        username = usernameInput.value || 'Player';
        if (username.trim() === '') {
            username = 'Player';
        }
        playerName.textContent = username;

        // Reset game state for a new round
        playerHealth = MAX_HEALTH;
        monsterHealth = MAX_HEALTH;
        turnCount = 0;
        strongAttackCooldown = 0; // Starts available
        healCooldown = 0; // Starts available
        
        // Ensure all buttons are enabled at the start of the game
        regularAttackBtn.disabled = false;
        
        startScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        logContainer.innerHTML = ''; // Clear the log
        updateHealthBars();
        updateButtonState();
        addLogMessage(`A new game has started on ${difficulty.toUpperCase()} difficulty! Good luck, ${username}!`, 'system-message');
    }
    
    // Function to update the disabled state of buttons based on cooldown
    function updateButtonState() {
        if (strongAttackCooldown > 0) {
            strongAttackBtn.disabled = true;
            strongAttackBtn.textContent = `Strong Attack (${strongAttackCooldown})`;
        } else {
            strongAttackBtn.disabled = false;
            strongAttackBtn.textContent = "Strong Attack";
        }

        if (healCooldown > 0) {
            healBtn.disabled = true;
            healBtn.textContent = `Heal (${healCooldown})`;
        } else {
            healBtn.disabled = false;
            healBtn.textContent = "Heal";
        }
    }

    // --- Game Logic Functions ---

    // Function for the player's turn
    function playerTurn(action) {
        if (checkForGameOver()) return;
        
        const settings = DIFFICULTY_SETTINGS[difficulty];
        
        let damage = 0;
        let heal = 0;
        
        turnCount++;
        
        if (action === 'regular') {
            damage = getRandomInt(settings.playerAttackMin, settings.playerAttackMax);
            monsterHealth -= damage;
            addLogMessage(`${username} dealt ${damage} damage with a regular attack!`, 'player-turn');
        } else if (action === 'strong' && strongAttackCooldown === 0) {
            damage = getRandomInt(settings.playerStrongAttackMin, settings.playerStrongAttackMax);
            monsterHealth -= damage;
            strongAttackCooldown = STRONG_ATTACK_COOLDOWN; // Set cooldown
            addLogMessage(`${username} dealt a massive ${damage} damage with a strong attack!`, 'player-turn');
        } else if (action === 'heal' && healCooldown === 0) {
            heal = getRandomInt(settings.playerHealMin, settings.playerHealMax);
            playerHealth = Math.min(MAX_HEALTH, playerHealth + heal);
            healCooldown = HEAL_COOLDOWN; // Set cooldown
            addLogMessage(`${username} healed for ${heal} health!`, 'player-turn');
        }

        // Decrement cooldowns
        if (strongAttackCooldown > 0) strongAttackCooldown--;
        if (healCooldown > 0) healCooldown--;

        updateHealthBars();
        if (checkForGameOver()) return;
        
        // After player's turn, monster attacks
        setTimeout(monsterTurn, 1000);
    }
    
    // Function for the monster's turn
    function monsterTurn() {
        if (checkForGameOver()) return;
        
        const settings = DIFFICULTY_SETTINGS[difficulty];
        const damage = getRandomInt(settings.monsterAttackMin, settings.monsterAttackMax);
        playerHealth -= damage;
        
        addLogMessage(`The monster attacks, dealing ${damage} damage!`, 'monster-turn');
        
        updateHealthBars();
        checkForGameOver();
        updateButtonState(); // Check button state after monster's turn
    }

    // --- Event Listeners ---
    
    regularAttackBtn.addEventListener('click', () => playerTurn('regular'));
    strongAttackBtn.addEventListener('click', () => playerTurn('strong'));
    healBtn.addEventListener('click', () => playerTurn('heal'));
    newGameBtn.addEventListener('click', showStartScreen);
    
    easyBtn.addEventListener('click', () => { difficulty = 'easy'; startGame(); });
    normalBtn.addEventListener('click', () => { difficulty = 'normal'; startGame(); });
    hardBtn.addEventListener('click', () => { difficulty = 'hard'; startGame(); });
    
    // Initialize the game by showing the start screen
    window.onload = function() {
        showStartScreen();
    };

</script>

</body>
</html>
